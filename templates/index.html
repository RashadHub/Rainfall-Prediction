<!DOCTYPE html>
<html lang="ar" dir="ltr">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rainfall Prediction</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            :root {
                --bg-1: #07111f;
                --bg-2: #0d1b2f;
                --card: rgba(15, 29, 49, 0.78);
                --card-strong: rgba(18, 35, 58, 0.92);
                --border: rgba(148, 163, 184, 0.16);
                --text: #f1f5f9;
                --muted: #94a3b8;
                --primary: #38bdf8;
                --primary-2: #2563eb;
                --success: #4ade80;
                --danger: #fb7185;
            }

            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background:
                    radial-gradient(circle at 15% 10%, rgba(56, 189, 248, 0.13), transparent 28%),
                    radial-gradient(circle at 85% 20%, rgba(37, 99, 235, 0.16), transparent 30%),
                    linear-gradient(145deg, var(--bg-1), var(--bg-2) 55%, #091525);
                min-height: 100vh;
                color: var(--text);
                position: relative;
                overflow-x: hidden;
            }

            body::before {
                content: "";
                position: fixed;
                inset: 0;
                pointer-events: none;
                background-image:
                    linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
                background-size: 36px 36px;
                mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.75), transparent 85%);
            }

            .container {
                max-width: 1280px;
                margin: 0 auto;
                padding: 42px 24px 56px;
                position: relative;
                z-index: 1;
            }

            header {
                text-align: center;
                margin-bottom: 34px;
            }

            header h1 {
                font-size: clamp(2rem, 4vw, 3.1rem);
                font-weight: 800;
                letter-spacing: -1px;
                background: linear-gradient(90deg, #67e8f9, #60a5fa, #818cf8);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                margin-bottom: 10px;
                filter: drop-shadow(0 8px 24px rgba(56, 189, 248, 0.12));
            }

            header p {
                color: var(--muted);
                font-size: 1rem;
                letter-spacing: 0.2px;
            }

            .layout {
                display: block;
            }

            .sidebar,
            .result-card {
                background: linear-gradient(145deg, rgba(18, 35, 58, 0.84), rgba(9, 22, 39, 0.78));
                border: 1px solid var(--border);
                box-shadow:
                    0 24px 60px rgba(0, 0, 0, 0.28),
                    inset 0 1px 0 rgba(255, 255, 255, 0.035);
                backdrop-filter: blur(18px);
                -webkit-backdrop-filter: blur(18px);
            }

            .sidebar {
                border-radius: 20px;
                padding: 26px;
                position: relative;
                width: 100%;
            }

            .sidebar h2 {
                margin-bottom: 24px;
            }

            .sidebar>.form-group {
                display: flex;
                flex-direction: column;
                min-width: 0;
            }

            /* Weather controls: multiple columns and rows */
            .sidebar {
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 18px 22px;
            }

            .sidebar h2 {
                grid-column: 1 / -1;
            }

            .sidebar>.form-group:last-of-type {
                grid-column: span 2;
            }

            .sidebar .btn-predict {
                grid-column: 1 / -1;
            }

            .sidebar h2 {
                display: flex;
                align-items: center;
                gap: 10px;
                font-size: 1.2rem;
                margin-bottom: 22px;
                color: #e2e8f0;
                padding-bottom: 15px;
                border-bottom: 1px solid rgba(148, 163, 184, 0.13);
            }

            .sidebar h2::before {
                content: "☁";
                width: 34px;
                height: 34px;
                display: grid;
                place-items: center;
                border-radius: 10px;
                background: rgba(56, 189, 248, 0.11);
                color: var(--primary);
                font-size: 1.05rem;
            }

            .main-content {
                min-width: 0;
                margin-top: 26px;
            }

            .result-card {
                border-radius: 22px;
                padding: 46px 32px;
                text-align: center;
                min-height: 360px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                transition: border-color 0.35s ease, background 0.35s ease, transform 0.35s ease, box-shadow 0.35s ease;
                position: relative;
                overflow: hidden;
            }

            .result-card::before {
                content: "";
                position: absolute;
                width: 260px;
                height: 260px;
                border-radius: 50%;
                background: rgba(56, 189, 248, 0.07);
                filter: blur(8px);
                top: -120px;
                right: -90px;
                pointer-events: none;
            }

            .result-card.rain {
                border-color: rgba(251, 113, 133, 0.48);
                background:
                    radial-gradient(circle at 50% 15%, rgba(251, 113, 133, 0.12), transparent 38%),
                    linear-gradient(145deg, rgba(60, 24, 42, 0.78), rgba(18, 29, 47, 0.84));
                box-shadow: 0 24px 70px rgba(251, 113, 133, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            }

            .result-card.no-rain {
                border-color: rgba(74, 222, 128, 0.42);
                background:
                    radial-gradient(circle at 50% 15%, rgba(74, 222, 128, 0.11), transparent 38%),
                    linear-gradient(145deg, rgba(17, 54, 43, 0.7), rgba(18, 35, 48, 0.84));
                box-shadow: 0 24px 70px rgba(74, 222, 128, 0.07), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            }

            .result-icon {
                width: 128px;
                height: 128px;
                display: grid;
                place-items: center;
                border-radius: 34px;
                font-size: 5rem;
                margin-bottom: 25px;
                background: rgba(255, 255, 255, 0.055);
                border: 1px solid rgba(255, 255, 255, 0.08);
                box-shadow: 0 18px 45px rgba(0, 0, 0, 0.2);
            }

            .result-title {
                font-size: clamp(1.55rem, 3vw, 2rem);
                font-weight: 800;
                letter-spacing: -0.4px;
                margin-bottom: 12px;
            }

            .result-prob {
                font-size: 1.05rem;
                color: #a8b5c7;
            }

            .placeholder-text {
                color: #718096;
                font-size: 1.05rem;
                max-width: 360px;
                line-height: 1.7;
            }

            .placeholder-text::before {
                content: "☔";
                display: block;
                font-size: 3.5rem;
                margin-bottom: 18px;
                opacity: 0.55;
            }

            .form-group {
                margin-bottom: 17px;
            }

            .form-group label {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 12px;
                font-size: 0.78rem;
                color: #aebdce;
                margin-bottom: 9px;
                line-height: 1.35;
            }

            .form-group label span.val {
                flex: 0 0 auto;
                min-width: 52px;
                text-align: right;
                color: #67e8f9;
                font-weight: 700;
                font-size: 0.82rem;
                font-variant-numeric: tabular-nums;
            }

            input[type="range"] {
                -webkit-appearance: none;
                appearance: none;
                width: 100%;
                height: 5px;
                border-radius: 99px;
                background: linear-gradient(90deg, rgba(56, 189, 248, 0.38), rgba(255, 255, 255, 0.10));
                outline: none;
                cursor: pointer;
            }

            input[type="range"]::-webkit-slider-thumb {
                -webkit-appearance: none;
                width: 17px;
                height: 17px;
                border-radius: 50%;
                background: #e0f2fe;
                border: 4px solid #38bdf8;
                cursor: pointer;
                box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.10), 0 3px 12px rgba(0, 0, 0, 0.25);
                transition: transform 0.15s ease, box-shadow 0.15s ease;
            }

            input[type="range"]::-webkit-slider-thumb:hover {
                transform: scale(1.12);
                box-shadow: 0 0 0 6px rgba(56, 189, 248, 0.11), 0 4px 15px rgba(0, 0, 0, 0.3);
            }

            input[type="range"]::-moz-range-thumb {
                width: 17px;
                height: 17px;
                border-radius: 50%;
                background: #e0f2fe;
                border: 4px solid #38bdf8;
                cursor: pointer;
                box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.10);
            }

            select {
                width: 100%;
                padding: 11px 13px;
                border-radius: 11px;
                border: 1px solid rgba(148, 163, 184, 0.18);
                background: rgba(255, 255, 255, 0.055);
                color: #e5edf7;
                font-size: 0.9rem;
                outline: none;
                cursor: pointer;
                transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
            }

            select:hover,
            select:focus {
                border-color: rgba(56, 189, 248, 0.5);
                background: rgba(255, 255, 255, 0.075);
                box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.07);
            }

            select option {
                background: #102038;
                color: #e5edf7;
            }

            .btn-predict {
                width: 100%;
                padding: 13px 16px;
                margin-top: 7px;
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 12px;
                background: linear-gradient(135deg, #0ea5e9, #2563eb);
                color: #fff;
                font-size: 1rem;
                font-weight: 750;
                letter-spacing: 0.15px;
                cursor: pointer;
                transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
                box-shadow: 0 12px 28px rgba(37, 99, 235, 0.24);
            }

            .btn-predict:hover {
                transform: translateY(-2px);
                filter: brightness(1.06);
                box-shadow: 0 15px 32px rgba(37, 99, 235, 0.32);
            }

            .btn-predict:active {
                transform: translateY(0);
            }

            .btn-predict:disabled {
                opacity: 0.6;
                cursor: not-allowed;
                transform: none;
                filter: none;
                box-shadow: none;
            }

            .loading {
                display: none;
                margin-top: 18px;
                text-align: center;
                color: var(--muted);
            }

            .spinner {
                width: 42px;
                height: 42px;
                border: 3px solid rgba(56, 189, 248, 0.13);
                border-top-color: #38bdf8;
                border-right-color: #2563eb;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
                margin: 0 auto 12px;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            @media (max-width: 1100px) {
                .sidebar {
                    grid-template-columns: repeat(3, minmax(0, 1fr));
                }
            }

            @media (max-width: 760px) {
                .sidebar {
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                }

                .sidebar>.form-group:last-of-type {
                    grid-column: span 2;
                }

                .result-card {
                    min-height: 390px;
                }
            }

            @media (max-width: 520px) {
                .container {
                    padding: 28px 14px 40px;
                }

                header {
                    margin-bottom: 25px;
                }

                .sidebar {
                    padding: 20px;
                    border-radius: 17px;
                    grid-template-columns: 1fr;
                    gap: 16px;
                }

                .sidebar>.form-group:last-of-type {
                    grid-column: auto;
                }

                .sidebar .btn-predict {
                    grid-column: auto;
                }

                .result-card {
                    min-height: 330px;
                    padding: 32px 20px;
                    border-radius: 18px;
                }

                .result-icon {
                    width: 100px;
                    height: 100px;
                    font-size: 4rem;
                    border-radius: 27px;
                }
            }
        </style>
    </head>

    <body>
        <div class="container">
            <header>
                <h1>Rainfall Prediction</h1>
                <p>Predict Whether It Will Rain Tomorrow</p>
            </header>

            <div class="layout">
                <aside class="sidebar">
                    <h2>Weather Input Features</h2>


                    <div class="form-group">
                        <label>Cloud Cover Mean (%) <span class="val" id="v_cloud">30</span></label>
                        <input type="range" id="cloud_cover_mean" min="0" max="100" step="1" value="30">
                    </div>
                    <div class="form-group">
                        <label>Max Humidity (%) <span class="val" id="v_hum_max">60</span></label>
                        <input type="range" id="humidity_max" min="0" max="100" step="1" value="60">
                    </div>
                    <div class="form-group">
                        <label>Max Wind Speed (km/h) <span class="val" id="v_wind_max">25</span></label>
                        <input type="range" id="wind_speed_max" min="0" max="80" step="0.1" value="25">
                    </div>
                    <div class="form-group">
                        <label>Min Pressure (hPa) <span class="val" id="v_pres_min">1010</span></label>
                        <input type="range" id="pressure_min" min="990" max="1040" step="0.1" value="1010">
                    </div>
                    <div class="form-group">
                        <label>Average Temperature (C) <span class="val" id="v_avg_temp">25</span></label>
                        <input type="range" id="avg_temp_ksa" min="-5" max="55" step="0.1" value="25">
                    </div>
                    <div class="form-group">
                        <label>Average Wind Speed (km/h) <span class="val" id="v_avg_wind">15</span></label>
                        <input type="range" id="avg_wind_ksa" min="0" max="50" step="0.1" value="15">
                    </div>
                    <div class="form-group">
                        <label>Average Humidity (%) <span class="val" id="v_avg_hum">50</span></label>
                        <input type="range" id="avg_humidity_ksa" min="0" max="100" step="0.1" value="50">
                    </div>
                    <div class="form-group">
                        <label>Average Barometer (hPa) <span class="val" id="v_avg_bar">1015</span></label>
                        <input type="range" id="avg_barometer_ksa" min="990" max="1040" step="0.1" value="1015">
                    </div>
                    <div class="form-group">
                        <label>Average Visibility (km) <span class="val" id="v_avg_vis">15</span></label>
                        <input type="range" id="avg_visibility_ksa" min="0" max="30" step="0.1" value="15">
                    </div>
                    <div class="form-group">
                        <label>Max Temperature (C) <span class="val" id="v_temp_max">35</span></label>
                        <input type="range" id="temp_max" min="-5" max="55" step="0.1" value="35">
                    </div>
                    <div class="form-group">
                        <label>Min Temperature (C) <span class="val" id="v_temp_min">18</span></label>
                        <input type="range" id="temp_min" min="-10" max="40" step="0.1" value="18">
                    </div>
                    <div class="form-group">
                        <label>Precipitation Sum (mm) <span class="val" id="v_precip">0</span></label>
                        <input type="range" id="precipitation_sum" min="0" max="50" step="0.1" value="0">
                    </div>
                    <div class="form-group">
                        <label>Rain Sum (mm) <span class="val" id="v_rain">0</span></label>
                        <input type="range" id="rain_sum" min="0" max="50" step="0.1" value="0">
                    </div>
                    <div class="form-group">
                        <label>Max Wind Speed (km/h) <span class="val" id="v_wind_max">25</span></label>
                        <input type="range" id="wind_speed_max" min="0" max="80" step="0.1" value="25">
                    </div>
                    <div class="form-group">
                        <label>Max Wind Gusts (km/h) <span class="val" id="v_gust">40</span></label>
                        <input type="range" id="wind_gusts_max" min="0" max="120" step="0.1" value="40">
                    </div>
                    <div class="form-group">
                        <label>Min Humidity (%) <span class="val" id="v_hum_min">20</span></label>
                        <input type="range" id="humidity_min" min="0" max="100" step="1" value="20">
                    </div>
                    <div class="form-group">
                        <label>Max Pressure (hPa) <span class="val" id="v_pres_max">1020</span></label>
                        <input type="range" id="pressure_max" min="990" max="1040" step="0.1" value="1020">
                    </div>



                    <div class="form-group">
                        <label>Location</label>
                        <select id="location_id">
                            <option value="0">Riyadh</option>
                            <option value="1">Mecca</option>
                            <option value="3">Madina</option>
                            <option value="4">Eastern Province</option>
                            <option value="5">Assir</option>
                            <option value="6">Tabuk</option>
                            <option value="7">Hail</option>
                            <option value="8">Qassim</option>
                            <option value="9">Najran</option>
                        </select>
                    </div>

                    <button class="btn-predict" id="predictBtn" onclick="predict()">Predict</button>
                </aside>

                <main class="main-content">
                    <div class="result-card" id="resultCard">
                        <div class="placeholder-text">Enter weather conditions and click Predict</div>
                    </div>
                    <div class="loading" id="loading">
                        <div class="spinner"></div>
                        <p>Analyzing weather data...</p>
                    </div>
                </main>
            </div>
        </div>

        <script>
            const sliders = document.querySelectorAll('input[type="range"]');
            sliders.forEach(slider => {
                const valEl = document.getElementById('v_' + {
                    'avg_temp_ksa': 'avg_temp',
                    'avg_wind_ksa': 'avg_wind',
                    'avg_humidity_ksa': 'avg_hum',
                    'avg_barometer_ksa': 'avg_bar',
                    'avg_visibility_ksa': 'avg_vis',
                    'temp_max': 'temp_max',
                    'temp_min': 'temp_min',
                    'precipitation_sum': 'precip',
                    'rain_sum': 'rain',
                    'wind_speed_max': 'wind_max',
                    'wind_gusts_max': 'gust',
                    'humidity_max': 'hum_max',
                    'humidity_min': 'hum_min',
                    'pressure_max': 'pres_max',
                    'pressure_min': 'pres_min',
                    'cloud_cover_mean': 'cloud'
                }[slider.id]);

                slider.addEventListener('input', () => {
                    valEl.textContent = slider.value;
                });
            });

            async function predict() {
                const btn = document.getElementById('predictBtn');
                const loading = document.getElementById('loading');
                const resultCard = document.getElementById('resultCard');

                btn.disabled = true;
                btn.textContent = 'Predicting...';
                loading.style.display = 'block';
                resultCard.style.display = 'none';

                const data = {
                    avg_temp_ksa: document.getElementById('avg_temp_ksa').value,
                    avg_wind_ksa: document.getElementById('avg_wind_ksa').value,
                    avg_humidity_ksa: document.getElementById('avg_humidity_ksa').value,
                    avg_barometer_ksa: document.getElementById('avg_barometer_ksa').value,
                    avg_visibility_ksa: document.getElementById('avg_visibility_ksa').value,
                    temp_max: document.getElementById('temp_max').value,
                    temp_min: document.getElementById('temp_min').value,
                    precipitation_sum: document.getElementById('precipitation_sum').value,
                    rain_sum: document.getElementById('rain_sum').value,
                    wind_speed_max: document.getElementById('wind_speed_max').value,
                    wind_gusts_max: document.getElementById('wind_gusts_max').value,
                    humidity_max: document.getElementById('humidity_max').value,
                    humidity_min: document.getElementById('humidity_min').value,
                    pressure_max: document.getElementById('pressure_max').value,
                    pressure_min: document.getElementById('pressure_min').value,
                    cloud_cover_mean: document.getElementById('cloud_cover_mean').value,
                    location_id: document.getElementById('location_id').value,
                };

                try {
                    const res = await fetch('/predict', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    const result = await res.json();

                    loading.style.display = 'none';
                    resultCard.style.display = 'flex';

                    if (result.prediction === 1) {
                        resultCard.className = 'result-card rain';
                        resultCard.innerHTML = `
                        <div class="result-icon">&#127783;</div>
                        <div class="result-title" style="color:#ef5350">Rain Tomorrow</div>
                        <div class="result-prob">Probability of rain: ${result.probability_rain}%</div>
                    `;
                    } else {
                        resultCard.className = 'result-card no-rain';
                        resultCard.innerHTML = `
                        <div class="result-icon">&#9728;</div>
                        <div class="result-title" style="color:#66bb6a">No Rain Tomorrow</div>
                        <div class="result-prob">Probability of no rain: ${result.probability_no_rain}%</div>
                    `;
                    }
                } catch (err) {
                    loading.style.display = 'none';
                    resultCard.style.display = 'flex';
                    resultCard.className = 'result-card';
                    resultCard.innerHTML = `<div class="result-title" style="color:#ef5350">Error: ${err.message}</div>`;
                }

                btn.disabled = false;
                btn.textContent = 'Predict';
            }
        </script>
    </body>

</html>
